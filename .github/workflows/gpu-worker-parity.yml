name: GPU worker parity

# Доводить, що runner цього репозиторію справді виконує ядро CUDA через
# спільний воркер cml: CPU-референс проти GPU, іменовані відмови, без тихого
# зеленого. Канонічний опис: juv4uk/sens docs/tooling/GPU-WORKER-PARITY.uk.md.
# Репозиторій не має власного GPU-коду, тому запуск лише вручну, на зміни самої
# перевірки та раз на тиждень (не займає єдину карту на кожному PR).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
    paths:
      - ".github/scripts/gpu-worker-parity.py"
      - ".github/workflows/gpu-worker-parity.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/gpu-worker-parity.py"
      - ".github/workflows/gpu-worker-parity.yml"

permissions:
  contents: read

# Одна фізична карта: нова заявка для тієї ж гілки/PR скасовує попередню.
# Між репозиторіями чергу веде сам воркер (замок допуску cml#603).
concurrency:
  group: gpu-worker-parity-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu-worker-parity:
    # Hardware UNVERIFIED when skipped. Set GITHUB_HOSTED_GPU_RUNNER only to a genuine GitHub-hosted GPU/FPGA runner.
    if: vars.GITHUB_HOSTED_GPU_RUNNER != ''
    # Лише GPU-runner: ніколи не падаємо назад на CPU-runner.
    runs-on: ubuntu-24.04  # fixed GitHub-hosted image; no variable-driven routing
    timeout-minutes: 10
    env:
      CML_GPU_WORKER_SOCKET: /run/cml-gpu-worker/worker.sock
    steps:
      - name: Verify GitHub-hosted GPU boundary
        shell: bash
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || { echo "::error::Self-hosted forbidden"; exit 1; }
          command -v nvidia-smi >/dev/null 2>&1 || { echo "::error::Hosted GPU larger runner required; CUDA parity unavailable"; exit 1; }
          nvidia-smi

      - uses: actions/checkout@v4

      # НЕ обгортати в flock: замок допуску бере сам воркер на опкодах з provenance.
      - name: CUDA parity against CPU reference
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/gpu-worker-parity.py --evidence gpu-worker-parity.json
          {
            echo '### GPU worker parity'
            echo '```json'
            cat gpu-worker-parity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
