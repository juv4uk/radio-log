name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: svelte-check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (svelte-check)
        run: bun run check

      - name: Unit tests (including SENS-RADIO / EMRG)
        run: bun run test

      - name: EMRG black-sky deterministic benchmark
        run: bun run bench:emrg

      - name: Upload EMRG benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: emrg-black-sky
          path: artifacts/emrg-black-sky.json
          if-no-files-found: error

      - name: SENS-RADIO deterministic impairment benchmark
        run: bun run bench:channel

      - name: Upload SENS-RADIO channel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sens-radio-channel-lab
          path: artifacts/sens-radio-channel-lab.json
          if-no-files-found: error

      - name: SENS-RADIO modem comparison benchmark
        run: bun run bench:modems

      - name: Upload SENS-RADIO modem comparison
        uses: actions/upload-artifact@v4
        with:
          name: sens-radio-modem-compare
          path: artifacts/sens-radio-modem-compare.json
          if-no-files-found: error

      - name: Build (static site)
        run: bun run build

  rust:
    name: cargo check + test (src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # System deps for the Tauri GTK/Linux build path.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check
        run: cargo check --all-targets
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      - name: clippy (zero warnings gate)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
